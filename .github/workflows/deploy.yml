name: Deploy - Site

# Publica na Vercel pelo GitHub, e não pela integração Git da Vercel (desligada
# no vercel.json): assim quem tem acesso só ao repositório também publica.
on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.inovasensor.com
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar a CLI da Vercel
        run: npm install --global vercel@64.7.0

      - name: Puxar a configuração de produção
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Publicar
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
