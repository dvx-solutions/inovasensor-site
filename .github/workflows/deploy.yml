name: Deploy - Site

# Publica na Vercel pelo GitHub, e não pela integração Git da Vercel (desligada
# no vercel.json): assim quem tem acesso só ao repositório também publica.
on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.inovasensor.com
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar a CLI da Vercel
        run: npm install --global vercel@64.7.0

      # Mesmo segredo do preview (scripts/definir-segredo-leads.sh): o agente CMO
      # usa para ler GET /api/leads da produção. Nunca aparece no log.
      - name: Gravar SITE_LEADS_TOKEN na produção da Vercel
        env:
          SEGREDO: ${{ secrets.SITE_LEADS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$SEGREDO" ]; then
            echo "::warning::Sem SITE_LEADS_TOKEN no GitHub: o CMO não vai conseguir ler os leads do site."
            exit 0
          fi
          echo "::add-mask::$SEGREDO"
          jq -n --arg v "$SEGREDO" '{key:"SITE_LEADS_TOKEN",value:$v,type:"encrypted",target:["production"]}' > corpo.json
          status=$(curl -sS -o resposta.json -w '%{http_code}' -X POST \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?upsert=true&teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" -H 'Content-Type: application/json' --data @corpo.json)
          rm -f corpo.json
          if [ "$status" -ge 300 ]; then jq -r '.error.message // "erro"' resposta.json; exit 1; fi
          echo "SITE_LEADS_TOKEN atualizado na produção."

      - name: Puxar a configuração de produção
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      # Fora da Vercel o Nitro cai no preset node e gera .output, que a CLI não
      # publica (o site ficava 404). O preset vercel gera .vercel/output.
      - name: Build
        env:
          NITRO_PRESET: vercel
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Publicar
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
